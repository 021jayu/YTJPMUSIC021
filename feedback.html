<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Feedback - YTJP MUSIC</title>
  <style>
    body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: #fff; }
    header, footer { background: #1a1a1a; padding: 20px; text-align: center; }
    .logo { font-size: 1.8rem; color: #1DB954; text-decoration: none; font-weight: bold; }
    nav { margin-top: 10px; }
    nav a { margin: 0 10px; color: #fff; text-decoration: none; }
    nav a:hover { color: #1DB954; }
    main { padding: 30px; max-width: 600px; margin: auto; }
    h1 { text-align: center; color: #1DB954; margin-bottom: 20px; }
    form { display: flex; flex-direction: column; gap: 15px; }
    input, textarea { padding: 10px; border-radius: 8px; border: none; font-size: 1rem; }
    textarea { resize: vertical; height: 100px; }
    button { background: #1DB954; border: none; color: #000; font-weight: bold; padding: 10px; border-radius: 6px; cursor: pointer; }
    button:hover { background: #17a34a; }
  </style>
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCHmCJxxxx",
      authDomain: "ytmusicdownload-d7404.firebaseapp.com",
      databaseURL: "https://ytmusicdownload-d7404-default-rtdb.firebaseio.com",
      projectId: "ytmusicdownload-d7404",
      storageBucket: "ytmusicdownload-d7404.appspot.com",
      messagingSenderId: "46025644xxxx",
      appId: "1:46025644xxxx:web:6d23xxxx"
    };
    firebase.initializeApp(firebaseConfig);
  </script>
</head>
<body>
  <header>
    <a href="index.html" class="logo">🎵 YTJP MUSIC</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="categories.html">Categories</a>
      <a href="profile.html">Profile</a>
      <a href="admin.html">Admin</a>
      <a href="about.html">About</a>
      <a href="feedback.html">Feedback</a>
    </nav>
  </header>

  <main>
    <h1>We Value Your Feedback</h1>
    <form onsubmit="saveFeedback(event)">
      <input type="text" id="name" placeholder="Your Name" required />
      <input type="email" id="email" placeholder="Your Email" required />
      <textarea id="message" placeholder="Your Message" required></textarea>
      <button type="submit">Send Feedback</button>
    </form>
  </main>

  <footer>
    <p>© 2025 YTJP MUSIC | Developed by Jayu STR</p>
  </footer>

  <script>
    function saveFeedback(e) {
      e.preventDefault();
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const message = document.getElementById("message").value.trim();

      if (!name || !email || !message) {
        alert("Please fill out all fields.");
        return;
      }

      firebase.database().ref("feedbacks").push({ name, email, message })
        .then(() => {
          alert("Thanks for your feedback!");
          document.querySelector("form").reset();
        })
        .catch(err => {
          console.error("Error saving feedback:", err);
          alert("Something went wrong!");
        });
    }
  </script>
</body>
</html>
