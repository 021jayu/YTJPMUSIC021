<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register - YT Music</title>
  <style>
    body {
      background: #0f0f0f;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: #1c1c1c;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,255,128,0.2);
      width: 100%;
      max-width: 400px;
    }

    h2 {
      text-align: center;
      color: #1DB954;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 6px;
      background: #333;
      color: #fff;
    }

    input:focus {
      outline: 2px solid #1DB954;
    }

    button {
      width: 100%;
      background: #1DB954;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #17a74a;
      transform: scale(1.03);
    }

    .login-link {
      text-align: center;
      margin-top: 15px;
    }

    .login-link a {
      color: #1DB954;
      text-decoration: none;
    }

    .login-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Register</h2>
    <input type="text" id="name" placeholder="Full Name" required>
    <input type="email" id="email" placeholder="Email" required>
    <input type="tel" id="mobile" placeholder="Mobile Number" required>
    <input type="password" id="password" placeholder="Password" required>
    <button onclick="register()">Register</button>
    <div class="login-link">
      Already have an account? <a href="login.html">Login here</a>
    </div>
  </div>
<footer style="background:#1a1a1a; padding:20px; text-align:center; color:white; font-size:0.9rem;">
  <div style="max-width:1200px; margin:auto; display:flex; flex-direction:column; align-items:center; gap:10px;">
    <div>
      <a href="index.html" style="color:#1DB954; font-weight:bold; font-size:1.2rem; text-decoration:none;">🎵 YTJP MUSIC</a>
    </div>
    <div style="display:flex; gap:15px; flex-wrap:wrap; justify-content:center;">
      <a href="index.html" style="color:white; text-decoration:none;">Home</a>
      <a href="about.html" style="color:white; text-decoration:none;">About</a>
      <a href="feedback.html" style="color:white; text-decoration:none;">Feedback</a>
    </div>
    <div style="font-size:0.85rem; color:#aaa;">
      &copy; 2025 JP MUSIC | Developed by Jayu STAR & JP STAR
    </div>
  </div>
</footer>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAr_hNAJ1VsC-n77tcwcc1L2gVhD_WJf7E",
      authDomain: "ytmusicdownload-d7404.firebaseapp.com",
      projectId: "ytmusicdownload-d7404",
      databaseURL: "https://ytmusicdownload-d7404-default-rtdb.firebaseio.com",
      storageBucket: "ytmusicdownload-d7404.appspot.com",
      messagingSenderId: "854569253804",
      appId: "1:854569253804:web:74031abd5082ccaca41809",
      measurementId: "G-KTBN19GM4E"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    function register() {
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const mobile = document.getElementById("mobile").value.trim();
      const password = document.getElementById("password").value.trim();

      const userData = { name, email, mobile, password };

      const usersRef = ref(db, "users");
      push(usersRef, userData)
        .then(() => {
          localStorage.setItem("user", JSON.stringify(userData));
          alert("Registration successful!");
          window.location.href = "index.html";
        })
        .catch((error) => {
          alert("Error saving data: " + error.message);
        });
    }

    window.register = register;
  </script>
</body>
</html>
