<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Categories - YTJP MUSIC</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap">
  <style>
    body {
      background: #0f0f0f;
      color: white;
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
    }

    header {
      position: sticky;
      top: 0;
      background: #1DB954;
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    .logo {
      font-size: 1.4rem;
      color: white;
      font-weight: bold;
      text-decoration: none;
    }

    nav {
      display: flex;
      gap: 15px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    main {
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #1DB954;
    }

    .category-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin-bottom: 30px;
    }

    .category-item {
      background: #181818;
      padding: 12px 20px;
      border-radius: 20px;
      color: white;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 0 8px #1DB95488;
    }

    .category-item:hover {
      background: #1DB954;
      color: #000;
    }

    .song-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 900px;
      margin: auto;
    }

    .song-card {
      background: #1a1a1a;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      box-shadow: 0 0 10px rgba(0,255,127,0.2);
      transition: transform 0.3s;
    }

    .song-card:hover {
      transform: scale(1.02);
    }

    .thumbnail {
      width: 160px;
      object-fit: cover;
    }

    .song-info {
      padding: 12px 16px;
      flex: 1;
    }

    .song-info h3 {
      margin: 0 0 5px;
      font-size: 1.2rem;
      color: #1DB954;
    }

    .song-info p {
      margin: 4px 0;
      font-size: 0.9rem;
      color: #ccc;
    }

    .btn-group {
      margin-top: 10px;
      display: flex;
      gap: 10px;
    }

    .btn-group a {
      background: #1DB954;
      padding: 8px 12px;
      color: black;
      font-weight: bold;
      text-decoration: none;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .btn-group a:hover {
      background: #17a74a;
    }

    @media (max-width: 768px) {
      .song-card {
        flex-direction: column;
      }

      .thumbnail {
        width: 100%;
        height: 180px;
      }
    }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="index.html">🎵 YTJP MUSIC</a>
    <nav>
      <a href="index.html#home">Home</a>
      <a href="index.html#songs">Music</a>
      <a href="categories.html">Categories</a>
      <a href="profile.html">Profile</a>
      <a href="contact.html">Contact</a>
      <a href="admin.html">Admin</a>
      <a href="login.html">Login</a>
    </nav>
  </header>

  <main>
    <h1>🎧 Browse by Category</h1>
    <div class="category-list" id="categoryList">Loading categories...</div>
    <div id="songContainer" class="song-list"></div>
  </main>

  <script>
    const firebaseUrl = "https://ytmusicdownload-d7404-default-rtdb.firebaseio.com/songs.json";
    let allSongs = [];

    fetch(firebaseUrl)
      .then(res => res.json())
      .then(data => {
        allSongs = Object.values(data || {});
        const categorySet = new Set(allSongs.map(song => song.category || "Uncategorized"));

        const categoryList = document.getElementById("categoryList");
        categoryList.innerHTML = "";

        categorySet.forEach(cat => {
          const div = document.createElement("div");
          div.className = "category-item";
          div.textContent = cat;
          div.onclick = () => filterSongs(cat);
          categoryList.appendChild(div);
        });

        // Default show all
        showSongs(allSongs);
      });

    function filterSongs(category) {
      const filtered = allSongs.filter(song => song.category === category);
      showSongs(filtered);
    }

    function showSongs(songs) {
      const container = document.getElementById("songContainer");
      container.innerHTML = "";

      if (songs.length === 0) {
        container.innerHTML = "<p style='text-align:center;'>No songs found.</p>";
        return;
      }

      songs.forEach(song => {
        const title = song.title || "Untitled";
        const artist = song.artist || "Unknown";
        const youtubeId = song.youtubeId || "dQw4w9WgXcQ";
        const driveLink = song.driveLink || "#";

        const div = document.createElement("div");
        div.className = "song-card";
        div.innerHTML = `
          <img class="thumbnail" src="http://img.youtube.com/vi/${youtubeId}/hqdefault.jpg" alt="${title}">
          <div class="song-info">
            <h3>${title}</h3>
            <p>🎤 ${artist}</p>
            <p>📁 ${song.category}</p>
            <div class="btn-group">
              <a href="https://www.youtube.com/watch?v=${youtubeId}" target="_blank">▶ YouTube</a>
              <a href="${driveLink}" target="_blank">⬇ MP3</a>
            </div>
          </div>
        `;
        container.appendChild(div);
      });
    }
  </script>
</body>
</html>
