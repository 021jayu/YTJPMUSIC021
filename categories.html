<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Categories - YTJP MUSIC</title>
  <style>
    body {
      background: #0f0f0f;
      color: white;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
    }
    header {
      position: sticky;
      top: 0;
      background: #1a1a1a;
      padding: 15px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.6);
      z-index: 999;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: #1DB954;
      text-decoration: none;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }
    nav a {
      color: white;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 6px;
      transition: background 0.3s, color 0.3s;
    }
    nav a:hover {
      background: #1DB954;
      color: #000;
    }
    main {
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #1DB954;
      margin: 30px 0;
    }
    .category-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 20px;
      padding: 10px;
    }
    .category-item {
      background: linear-gradient(135deg, #1DB95444, #0f0f0f);
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 0 10px #1db95433;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .category-item:hover {
      transform: translateY(-6px);
      box-shadow: 0 0 15px #1db954aa;
    }
    .category-item a {
      color: #fff;
      font-weight: 600;
      text-decoration: none;
      font-size: 1rem;
      display: block;
    }
    .emoji {
      font-size: 2rem;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="index.html">🎵 YTJP MUSIC</a>
    <nav>
      <a href="index.html#home">Home</a>
      <a href="index.html#songs">Music</a>
      <a href="categories.html">Categories</a>
      <a href="profile.html">Profile</a>
      <a href="admin.html">Admin</a>
      <a href="login.html">Login</a>
    </nav>
  </header>

  <main>
    <h1>🎧 Explore by Categories</h1>
    <div class="category-list" id="categoryList">
      <!-- Dynamic categories go here -->
    </div>
  </main>

  <script>
    const firebaseUrl = "https://ytmusicdownload-d7404-default-rtdb.firebaseio.com/songs.json";

    fetch(firebaseUrl)
      .then(res => res.json())
      .then(data => {
        const categorySet = new Set();
        Object.values(data || {}).forEach(song => {
          if (song.category) categorySet.add(song.category.trim());
        });

        const listContainer = document.getElementById("categoryList");
        if (categorySet.size === 0) {
          listContainer.innerHTML = "<p style='text-align:center;'>No categories found.</p>";
          return;
        }

        const emojis = ["🎶", "🎵", "🔥", "🎧", "💿", "🎸", "🪩", "🎤", "💥"];
        let i = 0;

        categorySet.forEach(cat => {
          const div = document.createElement("div");
          div.className = "category-item";
          div.innerHTML = `
            <div class="emoji">${emojis[i % emojis.length]}</div>
            <a href="index.html#${cat.toLowerCase().replace(/\s+/g, '-')}">${cat}</a>
          `;
          listContainer.appendChild(div);
          i++;
        });
      });
  </script>
</body>
</html>
