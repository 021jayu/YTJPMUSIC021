<!DOCTYPE html>

<head>

  <title>Contact Us - YTJP MUSIC</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f0f0;
      color: #222;
    }
    header {
      background: #1DB954;
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
    .logo {
      font-size: 1.5rem;
      text-decoration: none;
      color: white;
      font-weight: bold;
    }
    nav a {
      margin: 0 10px;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
    nav a:hover {
      text-decoration: underline;
    }

    .contact-section {
      max-width: 900px;
      margin: auto;
      background: white;
      padding: 40px 20px;
      margin-top: 40px;
      border-radius: 10px;
      box-shadow: 0 0 10px #aaa;
    }
    .contact-section h1 {
      color: #1DB954;
      text-align: center;
      margin-bottom: 30px;
    }
    .contact-info {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 20px;
    }
    .contact-box {
      flex: 1;
      min-width: 260px;
      background: #f9f9f9;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 5px #ccc;
    }
    .contact-box h3 {
      margin-bottom: 10px;
      color: #333;
    }
    .contact-box p, .contact-box a {
      font-size: 1rem;
      color: #555;
    }
    footer {
      text-align: center;
      padding: 15px;
      background: #1DB954;
      color: white;
      margin-top: 40px;
    }

    @media (max-width: 600px) {
      .contact-info {
        flex-direction: column;
      }
    }
  </style>
</head>
