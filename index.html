<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YTJP Music Gallery</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    body {
      margin: 0;
      background: #0f0f0f;
      color: white;
      font-family: 'Segoe UI', sans-serif;
      scroll-behavior: smooth;
    }

    header {
      position: sticky;
      top: 0;
      background: #111;
      padding: 15px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 1000;
      box-shadow: 0 2px 6px rgba(0,0,0,0.7);
    }

    .logo {
      color: #1DB954;
      font-weight: bold;
      font-size: 1.5rem;
      text-decoration: none;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    nav a {
      color: white;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 4px;
      transition: background 0.3s;
    }

    nav a:hover {
      background: #1DB954;
      color: black;
    }

    .menu-icon {
      display: none;
      font-size: 1.5rem;
      color: white;
      cursor: pointer;
    }

    /* HERO SLIDER */
    .hero-slider {
      position: relative;
      height: 60vh;
      overflow: hidden;
    }

    .hero-slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 1s ease-in-out;
      z-index: 1;
    }

    .hero-slide.active {
      opacity: 1;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      text-align: center;
      top: 50%;
      transform: translateY(-50%);
      color: white;
      background: rgba(0,0,0,0.4);
      padding: 20px;
      border-radius: 10px;
      margin: 0 20px;
    }

    .hero-content h1 {
      font-size: 2.4rem;
      margin-bottom: 10px;
      color: #1DB954;
    }

    .hero-content p {
      font-size: 1.1rem;
    }

    /* SONG LIST */
    h2 {
      text-align: center;
      margin: 40px 0 20px;
      color: #1DB954;
    }

    .song-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .song-box {
      background: #181818;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 15px #1db95444;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .song-box:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 20px #1db954aa;
    }

    .thumbnail {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-bottom: 1px solid #1db95433;
    }

    .song-details {
      padding: 15px;
    }

    .song-details h3 {
      color: #1DB954;
      margin: 0 0 8px;
      font-size: 1.1rem;
    }

    .song-details p {
      font-size: 0.9rem;
      margin: 4px 0;
      color: #ccc;
    }

    .btn-group {
      margin-top: 10px;
      display: flex;
      gap: 10px;
    }

    .btn-group a {
      flex: 1;
      padding: 8px;
      background: #1DB954;
      text-align: center;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      font-size: 0.85rem;
      transition: background 0.2s ease;
    }

    .btn-group a:hover {
      background: #1aa34a;
    }

    /* MOBILE RESPONSIVE */
    @media (max-width: 768px) {
      header {
        flex-wrap: wrap;
        justify-content: space-between;
      }

      .menu-icon {
        display: block;
      }

      nav {
        display: none;
        flex-direction: column;
        width: 100%;
        margin-top: 10px;
      }

      nav.show {
        display: flex;
      }

      .song-container {
        grid-template-columns: 1fr;
      }

      .btn-group {
        flex-direction: column;
      }

      .btn-group a {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- Header with Nav -->
  <header>
    <a href="#home" class="logo">🎵 YTJP MUSIC</a>
    <i class="fas fa-bars menu-icon" onclick="toggleMenu()"></i>
    <nav id="navbar">
      <a href="#home">Home</a>
      <a href="#songs">Music</a>
      <a href="#categories">Categories</a>
      <a href="profile.html"><i class="fas fa-user-circle"></i> Profile</a>
      <a href="admin.html">Admin</a>
      <a href="login.html">Login</a>
    </nav>
  </header>

  <!-- HERO SECTION with Two Images -->
  <section class="hero-slider">
    <div class="hero-slide active" style="background-image: url('https://drive.google.com/file/d/1ewPaB2j_EwKtTU_5NuDH1RFV4KPrjY4G/view?usp=drivesdk.jpg');"></div>
    <div class="hero-slide" style="background-image: url('https://i.ibb.co/0yQrPL7/photo2.jpg');"></div>
    <div class="hero-content">
      <h1>🎵 Welcome to JP MUSIC ZONE 🎵</h1>
      <p>Enjoy Timli, Hindi, EDM & More</p>
    </div>
  </section>

  <!-- SONG GALLERY -->
  <main>
    <h1 style="text-align:center; margin: 30px 0;" id="songs">🎼 Music Gallery 🎼</h1>
    <div class="song-container" id="songContainer"></div>
  </main>

  <!-- Firebase Song Load Script -->
  <script>
    const firebaseUrl = "https://ytmusicdownload-d7404-default-rtdb.firebaseio.com/songs.json";

    fetch(firebaseUrl)
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById("songContainer");
        if (!data) {
          container.innerHTML = "<p style='text-align:center;'>No songs uploaded yet.</p>";
          return;
        }

        Object.values(data).forEach(song => {
          const title = song.title || "Untitled Song";
          const artist = song.artist || "Unknown Artist";
          const category = song.category || "Uncategorized";
          const driveLink = song.driveLink || "#";
          const youtubeId = song.youtubeId || "";

          const box = document.createElement("div");
          box.className = "song-box";
          box.innerHTML = `
            <img class="thumbnail" src="https://img.youtube.com/vi/${youtubeId}/hqdefault.jpg" alt="${title}" />
            <div class="song-details">
              <h3>${title}</h3>
              <p>🎤 ${artist}</p>
              <p>📁 ${category}</p>
              <div class="btn-group">
                <a href="https://www.youtube.com/watch?v=${youtubeId}" target="_blank">▶️ YouTube</a>
                <a href="${driveLink}" target="_blank">⬇️ MP3</a>
              </div>
            </div>
          `;
          container.appendChild(box);
        });
      });
  </script>

  <!-- Slider Script -->
  <script>
    const slides = document.querySelectorAll(".hero-slide");
    let current = 0;
    setInterval(() => {
      slides[current].classList.remove("active");
      current = (current + 1) % slides.length;
      slides[current].classList.add("active");
    }, 5000);

    function toggleMenu() {
      document.getElementById("navbar").classList.toggle("show");
    }
  </script>
</body>
</html>
