<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YTJP Music Gallery</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background: #0f0f0f;
      color: white;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
    }

    header {
      position: sticky;
      top: 0;
      background: #1a1a1a;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 999;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    .logo {
      font-size: 1.4rem;
      font-weight: bold;
      color: #1DB954;
      text-decoration: none;
    }

    nav {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    nav a {
      color: white;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 4px;
      transition: 0.3s ease;
    }

    nav a:hover {
      background: #1DB954;
      color: #000;
    }

    h1 {
      text-align: center;
      color: #1DB954;
      margin: 20px 0;
    }

    .song-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .song-box {
      background: #181818;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 10px #1DB95440;
      transition: 0.3s ease;
    }

    .song-box:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 15px #1DB95480;
    }

    .thumbnail {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-bottom: 1px solid #1DB95420;
    }

    .song-details {
      padding: 15px;
    }

    .song-details h3 {
      margin: 0 0 8px;
      font-size: 1.1rem;
      color: #1DB954;
    }

    .song-details p {
      margin: 4px 0;
      color: #ccc;
      font-size: 0.9rem;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .btn-group a {
      flex: 1;
      background: #1DB954;
      color: black;
      text-align: center;
      padding: 8px;
      border-radius: 5px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s ease;
    }

    .btn-group a:hover {
      background: #17a54b;
    }

    @media (max-width: 600px) {
      .btn-group {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <header>
    <a class="logo" href="#">🎵 YTJP MUSIC</a>
    <nav>
      <a href="#home">Home</a>
      <a href="#songs">Music</a>
      <a href="#categories">Categories</a>
      <a href="profile.html">Profile</a>
      <a href="admin.html">Admin</a>
      <a href="login.html">Login</a>
    </nav>
  </header>

  <!-- Main -->
  <main id="home">
    <h1 id="songs">🎶 Music Gallery 🎶</h1>
    <div class="song-container" id="songContainer"></div>
  </main>

  <!-- Firebase Data -->
  <script>
    const firebaseUrl = "https://ytmusicdownload-d7404-default-rtdb.firebaseio.com/songs.json";

    fetch(firebaseUrl)
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById("songContainer");
        if (!data) {
          container.innerHTML = "<p style='text-align:center;'>No songs uploaded yet.</p>";
          return;
        }

        Object.values(data).forEach(song => {
          const title = song.title || "Untitled";
          const artist = song.artist || "Unknown Artist";
          const category = song.category || "Misc";
          const youtubeId = song.youtubeId || "";
          const driveLink = song.driveLink || "#";

          const box = document.createElement("div");
          box.className = "song-box";
          box.innerHTML = `
            <img class="thumbnail" src="https://img.youtube.com/vi/${youtubeId}/hqdefault.jpg" alt="${title}" />
            <div class="song-details">
              <h3>${title}</h3>
              <p>🎤 ${artist}</p>
              <p>📁 ${category}</p>
              <div class="btn-group">
                <a href="https://youtube.com/watch?v=${youtubeId}" target="_blank">▶️ YouTube</a>
                <a href="${driveLink}" target="_blank">⬇️ MP3</a>
              </div>
            </div>
          `;
          container.appendChild(box);
        });
      });
  </script>
</body>
</html>
