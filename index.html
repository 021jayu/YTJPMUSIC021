
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Music Gallery</title>
  <style>
    body { background: #0f0f0f; color: white; font-family: Arial, sans-serif; margin: 0; padding: 20px; }
    h1 { color: #1DB954; text-align: center; }
    .song-container { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; margin-top: 30px; }
    .song-box { background: #1c1c1c; border-radius: 10px; padding: 15px; width: 250px; box-shadow: 0 0 10px #1DB95440; transition: transform 0.3s; }
    .song-box:hover { transform: scale(1.05); }
    .song-box h3 { margin: 0 0 5px; color: #1DB954; }
    .song-box p { margin: 5px 0; font-size: 0.9em; }
    .btn-group { margin-top: 10px; display: flex; gap: 10px; }
    .btn-group a { flex: 1; padding: 8px; background: #1DB954; text-align: center; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; }
    .like { background: #ff4444 !important; }
  </style>
</head>
<body>
  <h1>🎵 Music Gallery 🎵</h1>
  <div class="song-container" id="songContainer"></div>

  <script>
    const firebaseUrl = "https://ytmusicdownload-d7404-default-rtdb.firebaseio.com/songs.json";

    fetch(firebaseUrl)
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById("songContainer");
        if (!data) {
          container.innerHTML = "<p>No songs uploaded yet.</p>";
          return;
        }
        Object.values(data).forEach(song => {
          const box = document.createElement("div");
          box.className = "song-box";
          box.innerHTML = `
            <h3>${song.title}</h3>
            <p>Artist: ${song.artist}</p>
            <p>Category: ${song.category}</p>
            <div class="btn-group">
              <a href="https://www.youtube.com/watch?v=${song.youtubeId}" target="_blank">▶️ YouTube</a>
              <a href="${song.driveLink}" target="_blank">⬇️ MP3</a>
            </div>
          `;
          container.appendChild(box);
        });
      });
  </script>
</body>
</html>
