<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jayu STR Music</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #00ff99;
    }

    form {
      background: #1a1a1a;
      padding: 20px;
      border-radius: 12px;
      max-width: 600px;
      margin: 20px auto;
    }

    form input, form button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: none;
      border-radius: 8px;
    }

    form input {
      background: #333;
      color: white;
    }

    form button {
      background: #00cc66;
      color: white;
      cursor: pointer;
    }

    form button:hover {
      background: #00994d;
    }

    .song-card {
      display: flex;
      background: #1e1e1e;
      margin: 15px auto;
      padding: 15px;
      border-radius: 10px;
      color: white;
      max-width: 800px;
    }

    .song-thumbnail {
      width: 160px;
      height: 90px;
      border-radius: 8px;
      margin-right: 15px;
    }

    .song-info {
      flex: 1;
    }

    .song-actions a, .song-actions button {
      display: inline-block;
      margin: 5px 5px 0 0;
      padding: 6px 12px;
      background: #00cc66;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }

    .song-actions a:hover, .song-actions button:hover {
      background: #00994d;
    }
  </style>
</head>
<body>
  <h1>🎶 Jayu STR Music Upload</h1>

  <form id="uploadForm">
    <input type="text" id="songName" placeholder="Song Name" required />
    <input type="text" id="youtubeID" placeholder="YouTube Video ID" required />
    <input type="text" id="driveLink" placeholder="Google Drive Link (MP3)" required />
    <input type="text" id="artistName" placeholder="Artist/Singer Name" />
    <input type="text" id="category" placeholder="Category (e.g., Timli, Hindi, Remix)" />
    <button type="submit">Upload Song</button>
  </form>

  <h2 style="text-align:center;">🎧 All Songs</h2>
  <div id="songsList"></div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase.js"></script>
  <script src="index.js"></script>
</body>
</html>
