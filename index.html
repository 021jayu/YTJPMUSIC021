<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YTJP Music Gallery</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    body {
      margin: 0;
      background: #0f0f0f;
      color: white;
      font-family: 'Segoe UI', sans-serif;
    }

    header {
      position: sticky;
      top: 0;
      background: #111;
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
    }

    .logo {
      color: #1DB954;
      font-size: 1.5rem;
      font-weight: bold;
      text-decoration: none;
    }

    .menu-icon {
      display: none;
      font-size: 1.5rem;
      color: white;
      cursor: pointer;
    }

    nav {
      display: flex;
      gap: 15px;
    }

    nav a {
      color: white;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 4px;
      transition: background 0.3s;
    }

    nav a:hover {
      background: #1DB954;
      color: black;
    }

    @media (max-width: 768px) {
      .menu-icon {
        display: block;
      }

      nav {
        display: none;
        flex-direction: column;
        width: 100%;
        margin-top: 10px;
      }

      nav.show {
        display: flex;
      }
    }

    /* HERO */
    .hero {
      background: url('https://i.ibb.co/VYW7zy2z/IMG-20250723-225211.jpg') center center / cover no-repeat;
      padding: 60px 20px;
      text-align: center;
      color: white;
    }

    .hero h1 {
      font-size: 2.2rem;
      margin-bottom: 10px;
      text-shadow: 0 0 5px #000;
    }

    .hero p {
      font-size: 1.1rem;
      color: #ccc;
    }
.hero-slideshow {
  position: relative;
  height: 60vh;
  animation: slideshow 15s infinite;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

@keyframes slideshow {
  0%   { background-image: url('https://i.ibb.co/Q7L60xgb/Whats-App-Image-2025-07-24-at-10-39-34-AM.jpg'); }
  20%  { background-image: url('https://i.ibb.co/Ldgrspp2/Picsart-25-07-24-12-57-36-887.png'); }
  40%  { background-image: url('https://i.ibb.co/BVSg8BZf/Picsart-25-07-24-13-03-45-658.png'); }
  60%  { background-image: url('https://i.ibb.co/RpXxTSxp/Picsart-25-07-24-13-03-15-531.png'); }
  80%  { background-image: url('https://i.ibb.co/j99C463m/Picsart-25-07-24-13-02-44-945.png'); }
  100% { background-image: url('https://i.ibb.co/1GwFZC1y/Picsart-25-07-24-13-02-15-129.png'); }
}

.hero-slideshow .overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.5);
  color: white;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.hero-slideshow h1 {
  font-size: 2.5rem;
  color: #1DB954;
}

.hero-slideshow p {
  font-size: 1.2rem;
  margin-top: 10px;
  color: #eee;
}

    /* SONG LIST */
    .songs-section {
      padding: 20px;
      max-width: 900px;
      margin: auto;
    }

    .song-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .song-card {
      display: flex;
      background: #1a1a1a;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 10px rgba(0,255,127,0.2);
      transition: transform 0.3s;
    }

    .song-card:hover {
      transform: scale(1.01);
    }

    .thumbnail {
      width: 160px;
      object-fit: cover;
    }

    .song-info {
      padding: 12px 16px;
      flex: 1;
    }

    .song-info h3 {
      margin: 0 0 6px;
      font-size: 1.2rem;
      color: #1DB954;
    }

    .song-info p {
      margin: 4px 0;
      font-size: 0.9rem;
      color: #ccc;
    }

    .btn-group {
      margin-top: 10px;
      display: flex;
      gap: 10px;
    }

    .btn-group a {
      background: #1DB954;
      padding: 8px 12px;
      color: black;
      font-weight: bold;
      text-decoration: none;
      border-radius: 6px;
      font-size: 0.85rem;
      transition: background 0.3s;
    }

    .btn-group a:hover {
      background: #17a74a;
    }

    @media (max-width: 768px) {
      .song-card {
        flex-direction: column;
      }

      .thumbnail {
        width: 100%;
        height: 180px;
      }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    
    <a class="logo" href="#home">🎵 YTJP MUSIC</a>
    <i class="fas fa-bars menu-icon" onclick="toggleMenu()"></i>
    <nav id="navbar">
      <a href="#home">Home</a>
      <a href="#songs">Music</a>
      <a href="#categories">Categories</a>
      <a href="profile.html"><i class="fas fa-user-circle"></i> Profile</a>
      <a href="admin.html">Admin</a>
      <a href="login.html">Login</a>
    </nav>
  </header>
<div class="hero-slideshow">
  <div class="overlay">
    <h1>🎵 JP Music Zone</h1>
    <p>Your Favorite Songs Collection</p>
  </div>
</div>

  <!-- HERO SECTION -->
  <section class="hero" id="home">
    <h1>Welcome to JP MUSIC ZONE</h1>
    <p>Enjoy Timli, Hindi, EDM & More</p>
  </section>

  <!-- SONGS SECTION -->
  <section class="songs-section" id="songs">
    <h2 style="text-align:center; color:#1DB954;">🎼 Music Gallery 🎼</h2>
    <div class="song-list" id="songContainer">
      <p style="text-align:center;">Loading songs...</p>
    </div>
  </section>

  <!-- Firebase Song Loader -->
  <script>
    const firebaseUrl = "https://ytmusicdownload-d7404-default-rtdb.firebaseio.com/songs.json";

    fetch(firebaseUrl)
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById("songContainer");
        container.innerHTML = "";

        if (!data) {
          container.innerHTML = "<p style='text-align:center;'>No songs available.</p>";
          return;
        }

        Object.values(data).forEach(song => {
          const title = song.title || "Untitled Song";
          const artist = song.artist || "Unknown Artist";
          const category = song.category || "Uncategorized";
          const driveLink = song.driveLink || "#";
          const youtubeId = song.youtubeId || "";

          const card = document.createElement("div");
          card.className = "song-card";
          card.innerHTML = `
            <img class="thumbnail" src="https://img.youtube.com/vi/${youtubeId}/hqdefault.jpg" alt="${title}">
            <div class="song-info">
              <h3>${title}</h3>
              <p>🎤 ${artist}</p>
              <p>📁 ${category}</p>
              <div class="btn-group">
                <a href="https://www.youtube.com/watch?v=${youtubeId}" target="_blank">▶ YouTube</a>
                <a href="${driveLink}" target="_blank">⬇ MP3</a>
              </div>
            </div>
          `;
          container.appendChild(card);
        });
      });
  </script>

  <script>
    function toggleMenu() {
      document.getElementById("navbar").classList.toggle("show");
    }
  </script>
</body>
</html>
