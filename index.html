<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Home – JAYU STR</title>
  <style>
    body {
      background-color: #0f0f0f;
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    header {
      background: #1DB954;
      padding: 15px 20px;
      color: black;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header nav a {
      color: black;
      text-decoration: none;
      margin: 0 10px;
      font-weight: bold;
    }

    h2 {
      text-align: center;
      margin: 20px 0;
      color: #1DB954;
    }

    .categories {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin-bottom: 30px;
    }

    .category {
      background: #1e1e1e;
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
      border: 2px solid transparent;
    }

    .category:hover {
      background: #1DB954;
      color: black;
      transform: scale(1.05);
      border-color: #fff;
    }

    .song-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      padding: 0 20px 40px;
    }

    .song-card {
      background: #1e1e1e;
      border-radius: 10px;
      overflow: hidden;
      transition: transform 0.3s;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }

    .song-card:hover {
      transform: scale(1.03);
    }

    .thumbnail {
      width: 100%;
      height: 160px;
      object-fit: cover;
    }

    .song-info {
      padding: 10px 15px;
    }

    .song-info h4 {
      margin: 0;
      color: #1DB954;
      font-size: 18px;
    }

    .song-info small {
      color: #aaa;
      display: block;
    }

    .actions {
      margin-top: 10px;
    }

    .actions a {
      background: #1DB954;
      color: black;
      padding: 7px 12px;
      border-radius: 5px;
      text-decoration: none;
      margin-right: 10px;
      display: inline-block;
      font-weight: bold;
    }

    .actions a:hover {
      background: #fff;
      color: black;
    }
  </style>
</head>
<body>

<header>
  <div><strong>🎵 JAYU STR Music</strong></div>
  <nav>
    <a href="index.html">Home</a>
    <a href="categories.html">Categories</a>
    <a href="admin.html">Admin</a>
    <a href="profile.html">Profile</a>
  </nav>
</header>

<h2>Categories</h2>
<div class="categories">
  <div class="category" onclick="filterSongs('All')">All</div>
  <div class="category" onclick="filterSongs('Timli')">Timli</div>
  <div class="category" onclick="filterSongs('Hindi')">Hindi</div>
  <div class="category" onclick="filterSongs('EDM')">EDM Mix</div>
  <div class="category" onclick="filterSongs('Chill')">Chill Out</div>
  <div class="category" onclick="filterSongs('Mashup')">Mashup</div>
</div>

<h2>Latest Songs</h2>
<div class="song-list" id="songList"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAr_hNAJ1VsC-n77tcwcc1L2gVhD_WJf7E",
    authDomain: "ytmusicdownload-d7404.firebaseapp.com",
    projectId: "ytmusicdownload-d7404",
    databaseURL: "https://ytmusicdownload-d7404-default-rtdb.firebaseio.com",
    appId: "1:854569253804:web:74031abd5082ccaca41809"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const songsRef = db.ref('songs');

  let allSongs = [];

  function listSongs(category = "All") {
    songsRef.once('value', snap => {
      const list = document.getElementById('songList');
      list.innerHTML = '';
      allSongs = [];

      snap.forEach(child => {
        const song = child.val();
        allSongs.push(song);
      });

      const filtered = category === "All" ? allSongs : allSongs.filter(song => song.category === category);

      if (filtered.length === 0) {
        list.innerHTML = "<p>No songs available in this category.</p>";
        return;
      }

      filtered.reverse().forEach(song => {
        const videoId = song.id;
        const thumbnailURL = `https://img.youtube.com/vi/${videoId}/mqdefault.jpg`;
        const div = document.createElement('div');
        div.className = 'song-card';
        div.innerHTML = `
          <img class="thumbnail" src="${thumbnailURL}" alt="Thumbnail">
          <div class="song-info">
            <h4>${song.name}</h4>
            <small>Artist: ${song.artist}</small>
            <small>Category: ${song.category}</small>
            <small>Date: ${song.date}</small>
            <div class="actions">
              <a href="https://drive.google.com/uc?export=download&id=${extractDriveId(song.driveLink)}" target="_blank">Download MP3</a>
              <a href="https://www.youtube.com/watch?v=${song.id}" target="_blank">Watch</a>
            </div>
          </div>
        `;
        list.appendChild(div);
      });
    });
  }

  function extractDriveId(link) {
    const match = link.match(/[-\w]{25,}/);
    return match ? match[0] : "";
  }

  function filterSongs(category) {
    listSongs(category);
  }

  // Load songs on page load
  listSongs();
</script>

</body>
</html>
