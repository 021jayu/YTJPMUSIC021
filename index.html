<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JP Music Zone</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: #0f0f0f;
      color: white;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1DB954;
      padding: 15px 25px;
      position: sticky;
      top: 0;
      z-index: 100;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 1.6rem;
      text-decoration: none;
      font-weight: bold;
      color: white;
    }

    nav {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      align-items: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .menu-icon {
      display: none;
      font-size: 1.8rem;
      color: white;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      nav {
        display: none;
        flex-direction: column;
        width: 100%;
        background-color: #1DB954;
        margin-top: 10px;
        padding: 10px 0;
      }

      nav.show {
        display: flex;
      }

      .menu-icon {
        display: block;
      }
    }
.category-box {
    display: inline-block;
    padding: 15px 25px;
    background: #1db954;
    color: white;
    font-size: 1.1rem;
    border-radius: 30px;
    text-decoration: none;
    transition: 0.3s;
  }

  .category-box:hover {
    background: #17a34a;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    transform: scale(1.05);
  }

  @media (max-width: 600px) {
    .category-box {
      font-size: 1rem;
      padding: 10px 20px;
    }
  }
    .hero-section {
      position: relative;
      width: 100%;
      height: 65vh;
      animation: slideshow 15s infinite;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-overlay {
      background: rgba(0, 0, 0, 0.55);
      padding: 30px 20px;
      text-align: center;
      width: 100%;
      box-sizing: border-box;
    }

    .hero-title {
      font-size: 3rem;
      color: #1DB954;
      margin: 0;
      animation: fadein 1.5s ease-in-out;
      font-weight: bold;
    }

    .hero-subtext {
      font-size: 1.3rem;
      color: #f0f0f0;
      margin-top: 15px;
      animation: fadein 2.5s ease-in-out;
      font-weight: 400;
    }

    @keyframes fadein {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideshow {
      0%    { background-image: url('https://i.ibb.co/Q7L60xgb/Whats-App-Image-2025-07-24-at-10-39-34-AM.jpg'); }
      20%  { background-image: url('https://i.ibb.co/Ldgrspp2/Picsart-25-07-24-12-57-36-887.png'); }
      40%  { background-image: url('https://i.ibb.co/BVSg8BZf/Picsart-25-07-24-13-03-45-658.png'); }
      60%  { background-image: url('https://i.ibb.co/RpXxTSxp/Picsart-25-07-24-13-03-15-531.png'); }
      80%  { background-image: url('https://i.ibb.co/j99C463m/Picsart-25-07-24-13-02-44-945.png'); }
      100% { background-image: url('https://i.ibb.co/1GwFZC1y/Picsart-25-07-24-13-02-15-129.png'); }
    }
.category-filter {
      text-align: center;
      margin-bottom: 20px;
      padding: 0 10px;
      flex-wrap: wrap;
      display: flex; /* Added for better button alignment */
      justify-content: center; /* Added for better button alignment */
    }

    .category-filter button {
      background: #1DB954;
      color: white;
      border: none;
      margin: 5px;
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s ease;
    }

    .category-filter button:hover,
    .category-filter button.active { /* Added active state */
      background: #17a74a;
    }
    /* SONG LIST */
    .songs-section {
      padding: 20px;
      max-width: 900px;
      margin: auto;
    }

    .song-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .song-card {
      display: flex;
      background: #1a1a1a;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 10px rgba(0,255,127,0.2);
      transition: transform 0.3s;
    }

    .song-card:hover {
      transform: scale(1.01);
    }

    .thumbnail {
      width: 160px;
      object-fit: cover;
    }

    .song-info {
      padding: 12px 16px;
      flex: 1;
    }

    .song-info h3 {
      margin: 0 0 6px;
      font-size: 1.2rem;
      color: #1DB954;
    }

    .song-info p {
      margin: 4px 0;
      font-size: 0.9rem;
      color: #ccc;
    }

    .btn-group {
      margin-top: 10px;
      display: flex;
      gap: 10px;
    }

    .btn-group a {
      background: #1DB954;
      padding: 8px 12px;
      color: black;
      font-weight: bold;
      text-decoration: none;
      border-radius: 6px;
      font-size: 0.85rem;
      transition: background 0.3s;
    }

    .btn-group a:hover {
      background: #17a74a;
    }

    @media (max-width: 768px) {
      .song-card {
        flex-direction: column;
      }

      .thumbnail {
        width: 100%;
        height: 180px;
      }
    }
  </style>
</head>
<body>

  <header>
    <a class="logo" href="#home">🎵 JP STAR & JAYU MUSIC</a>
    <i class="fas fa-bars menu-icon" onclick="toggleMenu()"></i>
    <nav id="navbar">
      <a href="#home">Home</a>
      <a href="#songs">Music</a>
     <a href="categories.html">Categories</a> <!-- ✅ Updated link -->
      <a href="profile.html"><i class="fas fa-user-circle"></i> Profile</a>
      <a href="contact.html">Contact</a>
      <a href="admin.html">Admin</a>
      <a href="login.html">Login</a>
    </nav>
  </header>

  <section class="hero-section" id="home">
    <div class="hero-overlay">
      <h1 class="hero-title">🎶 Welcome to JP Music Zone</h1>
      <p class="hero-subtext">Enjoy Timli, EDM, Mashup & Hindi Remixes — Updated Daily!</p>
    </div>
  </section>

</section>

  <div class="category-filter" id="categoryFilter"></div>
  <section class="songs-section" id="songs">
    <h2 style="text-align:center; color:#1DB954;">🎼 Music Gallery 🎼</h2>
    <div class="song-list" id="songContainer">
      <p style="text-align:center;">Loading songs...</p>
    </div>
  </section>

  <script>
    const firebaseUrl = "https://ytmusicdownload-d7404-default-rtdb.firebaseio.com/songs.json";
    let allSongs = []; // Store all songs for filtering

    // Function to display songs based on category
    function displaySongs(songsToDisplay) {
      const container = document.getElementById("songContainer");
      container.innerHTML = "";

      if (songsToDisplay.length === 0) {
        container.innerHTML = "<p style='text-align:center;'>No songs available for this category.</p>";
        return;
      }

      songsToDisplay.forEach(song => {
        const title = song.title || "Untitled Song";
        const artist = song.artist || "Unknown Artist";
        const category = song.category || "Uncategorized";
        const driveLink = song.driveLink || "#";
        const youtubeId = song.youtubeId || "dQw4w9WgXcQ"; // fallback

        const card = document.createElement("div");
        card.className = "song-card";
        card.setAttribute('data-category', category); // Add data-category attribute for filtering
        card.innerHTML = `
          <img class="thumbnail" src="http://img.youtube.com/vi/${youtubeId}/hqdefault.jpg" alt="${title}">
          <div class="song-info">
            <h3>${title}</h3>
            <p>🎤 ${artist}</p>
            <p>📁 ${category}</p>
            <div class="btn-group">
              <a href="https://www.youtube.com/watch?v=${youtubeId}" target="_blank">▶ YouTube</a>
              <a href="${driveLink}" target="_blank">⬇ MP3</a>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Function to create category filter buttons
    function createCategoryFilters(categories) {
      const filterContainer = document.getElementById("categoryFilter");
      filterContainer.innerHTML = "";

      // Add "All" button
      const allButton = document.createElement("button");
      allButton.textContent = "All";
      allButton.classList.add('active'); // Set "All" as active by default
      allButton.addEventListener('click', () => {
        displaySongs(allSongs);
        updateActiveButton(allButton);
      });
      filterContainer.appendChild(allButton);

      // Add buttons for each unique category
      categories.forEach(category => {
        const button = document.createElement("button");
        button.textContent = category;
        button.addEventListener('click', () => {
          const filteredSongs = allSongs.filter(song => song.category === category);
          displaySongs(filteredSongs);
          updateActiveButton(button);
        });
        filterContainer.appendChild(button);
      });
    }

    // Function to update active button styling
    function updateActiveButton(activeButton) {
      const buttons = document.querySelectorAll('#categoryFilter button');
      buttons.forEach(button => button.classList.remove('active'));
      activeButton.classList.add('active');
    }

    // Fetch songs from Firebase
    fetch(firebaseUrl)
      .then(res => res.json())
      .then(data => {
        if (!data) {
          document.getElementById("songContainer").innerHTML = "<p style='text-align:center;'>No songs available.</p>";
          return;
        }

        allSongs = Object.values(data); // Store all fetched songs

        // Get unique categories
        const categories = [...new Set(allSongs.map(song => song.category || "Uncategorized"))];
        createCategoryFilters(categories);

        // Display all songs initially
        displaySongs(allSongs);
      })
      .catch(error => {
        document.getElementById("songContainer").innerHTML = `<p style="text-align:center; color:red;">Error loading songs. Check Firebase connection.</p>`;
        console.error("Firebase fetch error:", error);
      });

    // Toggle menu for mobile
    function toggleMenu() {
      const navbar = document.getElementById("navbar");
      navbar.classList.toggle("show");
    }
  </script>

</body>
</html>
