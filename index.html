<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JAYU STR Music</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #0f0f0f;
      color: white;
    }

    header {
      background-color: #1db954;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-weight: bold;
    }

    .categories,
    .latest-songs {
      text-align: center;
      margin-top: 20px;
    }

    .filter-btn {
      padding: 10px 20px;
      margin: 5px;
      background-color: #1e1e1e;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .filter-btn:hover {
      background-color: #1db954;
    }

    .songs-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .song-card {
      background: #1e1e1e;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      transition: transform 0.3s ease;
    }

    .song-card:hover {
      transform: translateY(-5px);
    }

    .song-thumbnail {
      width: 100%;
      height: auto;
      display: block;
    }

    .song-info {
      padding: 15px;
    }

    .song-info h3 {
      color: #1db954;
      margin: 0;
      font-size: 1.1em;
    }

    .song-info p {
      font-size: 0.9em;
      margin: 5px 0;
    }

    .song-actions {
      margin-top: 10px;
    }

    .song-actions .btn {
      margin-right: 10px;
      padding: 8px 14px;
      border-radius: 5px;
      background-color: #1db954;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <header>
    <h1>🎵 JAYU STR Music</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="#">Categories</a>
      <a href="admin.html">Admin</a>
      <a href="profile.html">Profile</a>
    </nav>
  </header>

  <div class="categories">
    <h2>Categories</h2>
    <button class="filter-btn">All</button>
    <button class="filter-btn">Timli</button>
    <button class="filter-btn">Hindi</button>
    <button class="filter-btn">EDM Mix</button>
    <button class="filter-btn">Chill Out</button>
    <button class="filter-btn">Mashup</button>
  </div>

  <div class="latest-songs">
    <h2>Latest Songs</h2>
    <div class="songs-container" id="songsContainer">
      <!-- Songs will be inserted here dynamically -->
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      databaseURL: "https://ytpmusic021-default-rtdb.firebaseio.com/",
      apiKey: "AIzaSyCNZKhQGfqUR57t-w5PN4RVUeM5z_HxSmg",
      authDomain: "ytpmusic021.firebaseapp.com",
      projectId: "ytpmusic021",
      storageBucket: "ytpmusic021.appspot.com",
      messagingSenderId: "1038592098663",
      appId: "1:1038592098663:web:e8852a6e8cf1fc72c8ae6e"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    db.ref("songs").on("value", (snapshot) => {
      const songsContainer = document.getElementById("songsContainer");
      songsContainer.innerHTML = "";

      snapshot.forEach((childSnapshot) => {
        const songData = childSnapshot.val();
        const songCard = document.createElement("div");
        songCard.className = "song-card";

        const songName = songData.name || "Unknown Title";
        const youtubeID = songData.youtubeID || "";
        const thumbnailURL = youtubeID ? `https://img.youtube.com/vi/${youtubeID}/hqdefault.jpg` : "default.jpg";

        songCard.innerHTML = `
          <img src="${thumbnailURL}" alt="${songName}" class="song-thumbnail" />
          <div class="song-info">
            <h3>${songName}</h3>
            <p><strong>Artist:</strong> ${songData.artist || "Unknown"}</p>
            <p><strong>Category:</strong> ${songData.category || "Uncategorized"}</p>
            <p><strong>Date:</strong> ${songData.date || "N/A"}</p>
            <div class="song-actions">
              <a href="${songData.driveLink || "#"}" class="btn" target="_blank">Download MP3</a>
              <a href="https://www.youtube.com/watch?v=${youtubeID}" class="btn" target="_blank">Watch</a>
            </div>
          </div>
        `;

        songsContainer.appendChild(songCard);
      });
    });
  </script>
</body>

</html>
