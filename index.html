<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Music Gallery</title>
  <style>
    body {
      background: #0f0f0f;
      color: white;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }

    h1 {
      color: #1DB954;
      text-align: center;
      font-size: 2.2rem;
      margin-bottom: 30px;
    }

    .song-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 10px;
    }

    .song-box {
      background: #181818;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 15px #1db95444;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .song-box:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 20px #1db954aa;
    }

    .thumbnail {
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-bottom: 1px solid #1db95433;
    }

    .song-details {
      padding: 15px;
    }

    .song-details h3 {
      color: #1DB954;
      margin: 0 0 8px;
      font-size: 1.1rem;
    }

    .song-details p {
      font-size: 0.9rem;
      margin: 4px 0;
      color: #ccc;
    }

    .btn-group {
      margin-top: 10px;
      display: flex;
      gap: 10px;
    }

    .btn-group a {
      flex: 1;
      padding: 8px;
      background: #1DB954;
      text-align: center;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      font-size: 0.85rem;
      transition: background 0.2s ease;
    }

    .btn-group a:hover {
      background: #1aa34a;
    }

    .like {
      background: #ff4444 !important;
    }
  </style>
</head>
<body>
  <h1>🎵 Music Gallery 🎵</h1>
  <div class="song-container" id="songContainer"></div>

  <script>
    const firebaseUrl = "https://ytmusicdownload-d7404-default-rtdb.firebaseio.com/songs.json";

    fetch(firebaseUrl)
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById("songContainer");
        if (!data) {
          container.innerHTML = "<p>No songs uploaded yet.</p>";
          return;
        }

        Object.values(data).forEach(song => {
          const title = song.title || "Untitled Song";
          const artist = song.artist || "Unknown Artist";
          const category = song.category || "Uncategorized";
          const driveLink = song.driveLink || "#";
          const youtubeId = song.youtubeId || "";

          const box = document.createElement("div");
          box.className = "song-box";
          box.innerHTML = `
            <img class="thumbnail" src="https://img.youtube.com/vi/${youtubeId}/hqdefault.jpg" alt="${title}" />
            <div class="song-details">
              <h3>${title}</h3>
              <p>🎤 ${artist}</p>
              <p>📁 ${category}</p>
              <div class="btn-group">
                <a href="https://www.youtube.com/watch?v=${youtubeId}" target="_blank">▶️ YouTube</a>
                <a href="${driveLink}" target="_blank">⬇️ MP3</a>
              </div>
            </div>
          `;
          container.appendChild(box);
        });
      });
  </script>
</body>
</html>
