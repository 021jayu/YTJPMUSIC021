<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YTJP Music Gallery</title>
  <style>
    body {
      margin: 0;
      background: #0f0f0f;
      color: white;
      font-family: 'Segoe UI', sans-serif;
      scroll-behavior: smooth;
    }

    header {
      position: sticky;
      top: 0;
      background: #111;
      padding: 15px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 1000;
      box-shadow: 0 2px 6px rgba(0,0,0,0.7);
    }

    .logo {
      color: #1DB954;
      font-weight: bold;
      font-size: 1.5rem;
      text-decoration: none;
    }

    nav {
      display: flex;
      gap: 15px;
    }

    nav a {
      color: white;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 4px;
      transition: background 0.3s;
    }

    nav a:hover {
      background: #1DB954;
      color: black;
    }
    .hero {
  background: url('https://drive.google.com/uc?export=view&id=1f1d0-hCFOqbhIqSv5dkn6bANS5GXWg99') no-repeat center center/cover;)
  height: 60vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
}

.hero-overlay {
  background: rgba(0, 0, 0, 0.5);
  padding: 30px;
  text-align: center;
  border-radius: 12px;
}

.hero h1 {
  font-size: 2.5rem;
  margin-bottom: 10px;
  color: #1DB954;
}

.hero p {
  font-size: 1.1rem;
  color: #ccc;
}

    .hero {
      background: url('https://drive.google.com/file/d/1f1d0-hCFOqbhIqSv5dkn6bANS5GXWg99/view?usp=drivesdk') no-repeat center center/cover;)
      height: 60vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .hero h1 {
      font-size: 2.5rem;
      color: #1DB954;
      text-shadow: 2px 2px 4px #000;
    }

    .song-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 30px;
    }

    .song-box {
      background: #181818;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 15px #1db95433;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .song-box:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 20px #1db95488;
    }

    .thumbnail {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-bottom: 1px solid #1db95444;
    }

    .song-details {
      padding: 15px;
    }

    .song-details h3 {
      margin: 0 0 6px;
      font-size: 1.1rem;
      color: #1DB954;
    }

    .song-details p {
      margin: 4px 0;
      color: #ccc;
      font-size: 0.9rem;
    }

    .btn-group {
      margin-top: 10px;
      display: flex;
      gap: 10px;
    }

    .btn-group a {
      flex: 1;
      padding: 8px;
      background: #1DB954;
      color: white;
      text-align: center;
      text-decoration: none;
      border-radius: 5px;
      font-size: 0.85rem;
      font-weight: bold;
      transition: background 0.2s ease;
    }

    .btn-group a:hover {
      background: #14833b;
    }
    /* --- MOBILE RESPONSIVE FIX --- */
@media (max-width: 768px) {
  header {
    flex-direction: column;
    align-items: flex-start;
    padding: 10px 20px;
  }

  nav {
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 10px;
  }

  .hero h1 {
    font-size: 1.5rem;
    padding: 0 10px;
  }

  .song-container {
    grid-template-columns: 1fr;
    padding: 15px;
  }

  .song-box {
    margin-bottom: 20px;
  }

  .btn-group {
    flex-direction: column;
  }

  .btn-group a {
    width: 100%;
  }
}
  </style>
</head>
<body>

  <!-- Navigation -->
  <header>
    <a href="#home" class="logo">🎵 YTJP MUSIC</a>
    <nav>
      <a href="#home">Home</a>
      <a href="#songs">Music</a>
      <a href="#categories">Categories</a>
      <a href="profile.html">Profile</a>
      <a href="admin.html">Admin</a>
      <a href="login.html">Login</a>
    </nav>
  </header>

  <!-- HERO SECTION -->
  <section id="home" class="hero">
    <h1>🎶 Welcome to YTJP Music Zone 🎶</h1>
  </section>
<section class="hero">
  <div class="hero-overlay">
    <h1>🎵 JP MUSIC ZONE 🎵</h1>
    <p>Discover, Download & Enjoy Your Favorite Tracks</p>
  </div>
</section>
  <!-- SONG GALLERY -->
  <main>
    <h1 style="text-align:center; margin: 30px 0;" id="songs">🎼 Music Gallery 🎼</h1>
    <div class="song-container" id="songContainer"></div>
  </main>

  <!-- FIREBASE SONG LOAD SCRIPT -->
  <script>
    const firebaseUrl = "https://ytmusicdownload-d7404-default-rtdb.firebaseio.com/songs.json";

    fetch(firebaseUrl)
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById("songContainer");
        if (!data) {
          container.innerHTML = "<p style='text-align:center;'>No songs uploaded yet.</p>";
          return;
        }

        Object.values(data).forEach(song => {
          const title = song.title || "Untitled Song";
          const artist = song.artist || "Unknown Artist";
          const category = song.category || "Uncategorized";
          const driveLink = song.driveLink || "#";
          const youtubeId = song.youtubeId || "";

          const box = document.createElement("div");
          box.className = "song-box";
          box.innerHTML = `
            <img class="thumbnail" src="https://img.youtube.com/vi/${youtubeId}/hqdefault.jpg" alt="${title}" />
            <div class="song-details">
              <h3>${title}</h3>
              <p>🎤 ${artist}</p>
              <p>📁 ${category}</p>
              <div class="btn-group">
                <a href="https://www.youtube.com/watch?v=${youtubeId}" target="_blank">▶️ YouTube</a>
                <a href="${driveLink}" target="_blank">⬇️ MP3</a>
              </div>
            </div>
          `;
          container.appendChild(box);
        });
      });
  </script>

</body>
</html>
